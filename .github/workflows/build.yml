name: EAS Build

on:
  push:
    branches: [main, develop, claude/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development, preview, production)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - all

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate eas.json
        run: node -e "console.log('eas.json is valid:', !!require('./eas.json'))"

      - name: Validate app.json
        run: node -e "console.log('app.json is valid:', !!require('./app.json'))"

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  build:
    name: EAS Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Get build profile
        id: build-profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
          else
            echo "profile=development" >> $GITHUB_OUTPUT
            echo "platform=ios" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS
        run: |
          eas build \
            --platform ${{ steps.build-profile.outputs.platform }} \
            --profile ${{ steps.build-profile.outputs.profile }} \
            --non-interactive \
            --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build summary
        run: |
          echo "### EAS Build Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ steps.build-profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ steps.build-profile.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check [Expo dashboard](https://expo.dev) for build progress" >> $GITHUB_STEP_SUMMARY

  verify-pr:
    name: Verify PR Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build configuration
        run: |
          echo "### Build Configuration Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build configuration has been validated for this PR." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To trigger an actual build:" >> $GITHUB_STEP_SUMMARY
          echo "1. Push to main, develop, or claude/* branches" >> $GITHUB_STEP_SUMMARY
          echo "2. Or use the 'Actions' tab and run workflow manually" >> $GITHUB_STEP_SUMMARY
