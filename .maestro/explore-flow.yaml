appId: com.reponexus.ios
---
# Explore Screen Flow Test
- launchApp
- tapOn: "Explore"
- assertVisible: "Search repositories"

# Search for repositories
- tapOn: "Search repositories"
- inputText: "typescript"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: "TypeScript"

# Scroll through results
- scroll:
    until:
      visible: "microsoft/TypeScript"
    timeout: 10000

# Navigate to repository detail
- tapOn: "microsoft/TypeScript"
- assertVisible: "Star"
- assertVisible: "Fork"

# Navigate back
- back
- assertVisible: "Search repositories"

# Clear search
- tapOn: "Search repositories"
- clearText
- assertVisible: "Explore"

# Test filters
- tapOn: "Filter"
- tapOn: "JavaScript"
- tapOn: "Apply"
- waitForAnimationToEnd

# Verify filtered results
- assertVisible:
    text: "JavaScript"
    timeout: 5000
